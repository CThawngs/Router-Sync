name: Flake Hunt (manual)

# C26 D2.3: manual-only reproduction of flake repro tests.
# Not part of the required CI job set; no continue-on-error anywhere.
# C28 H0.2: accepts a target test path + vitest project + runs-on + node, so
# the e2e daemon-health flake can be reproduced on ubuntu-24.04-arm node 22.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of times to run the target test'
        required: false
        default: '30'
        type: string
      test_path:
        description: 'Vitest test path to repeat'
        required: false
        default: 'test/acceptance/at-98.test.ts'
      project:
        description: 'Vitest project for the target test'
        required: false
        default: 'root-tools'
      os:
        description: 'Runner OS for this dispatch'
        required: false
        default: 'windows-11-arm'
      node:
        description: 'Node version for this dispatch'
        required: false
        default: '24'

permissions:
  contents: read

jobs:
  flake-hunt:
    name: flake-hunt (${{ inputs.os }}, node ${{ inputs.node }}, ${{ inputs.test_path }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: ${{ inputs.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repeat target test and collect red diagnostics
        shell: bash
        env:
          ITERATIONS: ${{ inputs.iterations }}
          TEST_PATH: ${{ inputs.test_path }}
          PROJECT: ${{ inputs.project }}
        run: |
          set +e
          red=0
          for i in $(seq 1 "$ITERATIONS"); do
            echo "=== iteration $i / $ITERATIONS ==="
            output=$(pnpm exec vitest run --project "$PROJECT" "$TEST_PATH" 2>&1)
            status=$?
            echo "$output"
            if [ "$status" -ne 0 ]; then
              red=$((red + 1))
              echo "FLAKE-HUNT RED iteration=$i status=$status"
              echo "$output" | grep -E 'readBackLevel|staleDetected|AssertionError|read-back|daemon health failed|exited=|Listening on' | head -30
            fi
          done
          echo "FLAKE-HUNT SUMMARY os=${{ inputs.os }} node=${{ inputs.node }} test=$TEST_PATH project=$PROJECT iterations=$ITERATIONS red=$red"
          if [ "$red" -gt 0 ]; then exit 1; fi
          exit 0
