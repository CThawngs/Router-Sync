name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Secret & Personal Path Guard
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

      - name: End-to-end
        run: pnpm e2e

      - name: Memory report (both APIs)
        run: node tools/ci/mem-report.mjs

      - name: Prepare offline sample state
        shell: bash
        run: |
          node tools/ci/make-sample-state.mjs "${RUNNER_TEMP}/rs-sample"
          cat "${RUNNER_TEMP}/rs-sample/sample.env" >> "$GITHUB_ENV"

      - name: Product smoke with perf budgets
        shell: bash
        run: |
          set -e
          run_smoke() {
            mkdir -p "${RUNNER_TEMP}/rs-perf"
            for item in "doctor:doctor" "plan:plan" "verify:verify" "scan:scan" "rank-json:rank --json"; do
              name="${item%%:*}"
              args="${item#*:}"
              ROUTERSYNC_PERF=1 node packages/cli/dist/index.js $args \
                > "${RUNNER_TEMP}/rs-perf/${name}.out" 2> "${RUNNER_TEMP}/rs-perf/${name}.err"
              node tools/ci/check-perf.mjs "${RUNNER_TEMP}/rs-perf/${name}.err" "$name"
            done
          }
          ok=0
          for attempt in 1 2 3; do
            if run_smoke; then ok=1; break; fi
            if [ "$attempt" -eq 3 ]; then break; fi
            sleep 15
          done
          [ "$ok" -eq 1 ]

      - name: Emit schedule artifacts (no install)
        run: node tools/ci/emit-schedule-artifacts.mjs "${{ runner.temp }}/schedule-artifacts"

      - name: Check low-priority keys in schedule artifacts
        shell: bash
        run: |
          node tools/ci/check-schedule-keys.mjs "${RUNNER_TEMP}/schedule-artifacts"

      - name: Lint systemd units (Linux)
        if: runner.os == 'Linux'
        run: |
          cd "${{ runner.temp }}/schedule-artifacts"
          systemd-analyze verify --user ./routersync-daemon.service ./routersync-daemon.timer

      - name: Validate Windows task XML with schtasks (create then delete)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $xml = Join-Path $env:RUNNER_TEMP 'schedule-artifacts/routersync-task.xml'
          $name = 'RouterSyncC15Smoke'
          schtasks /create /tn $name /xml $xml /f
          schtasks /delete /tn $name /f

      - name: Lint launchd plist (macOS)
        if: runner.os == 'macOS'
        run: plutil -lint "${{ runner.temp }}/schedule-artifacts/com.routersync.daemon.plist"

  footprint:
    name: footprint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.0.0
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack, install, measure
        run: node tools/ci/footprint.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: footprint-${{ matrix.os }}
          path: footprint.json

  weak-linux:
    name: weak-linux (node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node }}-slim
      options: --memory=1g --memory-swap=1g --cpus=1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare sample state
        run: node tools/ci/make-sample-state.mjs /tmp/rs-sample
      - name: Product smoke under 1 GiB
        shell: bash
        run: |
          set -e
          set -a
          source /tmp/rs-sample/sample.env
          set +a
          for args in "doctor" "plan" "verify" "scan" "rank --json"; do
            echo "SMOKE $args"
            if ROUTERSYNC_PERF=1 node packages/cli/dist/index.js $args > /tmp/out.txt 2> /tmp/err.txt; then
              grep '\[routersync-perf\]' /tmp/err.txt || true
            else
              echo "SMOKE FAILED: $args"
              echo "--- stdout ---"; cat /tmp/out.txt
              echo "--- stderr ---"; cat /tmp/err.txt
              exit 1
            fi
          done

  ui:
    name: ui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: UI tests
        run: pnpm --filter @routersync/ui test

  slow:
    name: slow tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Slow tests
        run: pnpm test:slow
