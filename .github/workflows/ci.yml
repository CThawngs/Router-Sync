name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Secret & Personal Path Guard
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

      - name: End-to-end
        run: pnpm e2e

      - name: Emit schedule artifacts (no install)
        run: node tools/ci/emit-schedule-artifacts.mjs "${{ runner.temp }}/schedule-artifacts"

      - name: Lint systemd units (ubuntu)
        if: runner.os == 'Linux'
        run: |
          # systemd-analyze verify needs the ExecStart binary to exist; node and index.js do.
          cd "${{ runner.temp }}/schedule-artifacts"
          systemd-analyze verify --user ./routersync-daemon.service ./routersync-daemon.timer

      - name: Lint launchd plist (macOS)
        if: runner.os == 'macOS'
        run: plutil -lint "${{ runner.temp }}/schedule-artifacts/com.routersync.daemon.plist"

      - name: Parse Task Scheduler XML (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $f = Join-Path $env:RUNNER_TEMP 'schedule-artifacts/routersync-task.xml'
          $bytes = [IO.File]::ReadAllBytes($f)
          if ($bytes[0] -ne 0xFF -or $bytes[1] -ne 0xFE) { throw 'missing UTF-16 LE BOM' }
          $xml = New-Object System.Xml.XmlDocument
          $xml.Load($f)
          $cmd = $xml.Task.Actions.Exec.Command
          if (-not [IO.Path]::IsPathRooted($cmd)) { throw "Command is not absolute: $cmd" }
          Write-Host "XML OK, Command=$cmd"

  ui:
    name: ui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: UI tests
        run: pnpm --filter @routersync/ui test

  slow:
    name: slow tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Slow tests
        run: pnpm test:slow
