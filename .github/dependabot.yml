version: 2
updates:
  # Monthly on purpose. Weekly updates produced one full CI run (18 jobs) per PR;
  # C21 X6 counted 46 red runs in three days, and each Dependabot PR multiplies
  # that. Security updates are handled separately by GitHub and are unaffected.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "04:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    versioning-strategy: increase
    labels:
      - dependencies
    groups:
      # One PR per cycle for everything minor and patch: majors stay separate so
      # a breaking bump is reviewed on its own.
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "04:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch