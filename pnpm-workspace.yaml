packages:
  - 'packages/*'

# Only esbuild needs an install script (it checks the platform binary).
# better-sqlite3 ships a prebuilt binary for macOS (Intel and Apple
# Silicon), Linux (x64 and arm64) and Windows inside the npm package, so no
# C++ toolchain is needed on the machine of the user.
onlyBuiltDependencies:
  - esbuild

overrides:
  hono: 4.13.19
  '@hono/node-server': 2.1.9
  body-parser: 2.4.0
  qs: 6.17.1
  fast-uri: 3.1.9

# Dependabot resolves against a minimum release age. Newly published patched
# versions must be exempt so its updater can install this lockfile.
minimumReleaseAgeExclude:
  - hono
  - '@hono/node-server'
  - body-parser
  - qs
  - fast-uri
  - vitest
  - vite
  - zod
  - esbuild
  - tinypool

